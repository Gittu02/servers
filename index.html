<script>
// ===================================================
// CHANGE ONLY THIS HASH.
// Generate SHA-256 hash of your PIN and paste here.
// Example hash below is for PIN: 1234
// ===================================================
const PIN_HASH="6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b";

async function sha256(t){
 const b=new TextEncoder().encode(t);
 const h=await crypto.subtle.digest("SHA-256",b);
 return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function check(){
 let h=await sha256(document.getElementById("pin").value);
 if(h===PIN_HASH){
   login.style.display="none";
   content.style.display="block";
 }else msg.textContent="Wrong PIN";
}
pin.addEventListener("keydown",e=>{if(e.key==="Enter")check();});
</script>
